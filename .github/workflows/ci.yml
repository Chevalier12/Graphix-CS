name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  managed:
    name: Managed build and tests
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout SDL3-CS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
            7.0.x

      - name: Restore managed projects
        shell: pwsh
        run: |
          dotnet restore .\SDL3-CS\SDL3-CS.csproj --force --no-cache
          dotnet restore .\SDL3-CS.Tests\SDL3-CS.Tests.csproj --force --no-cache
          dotnet restore .\SDL3-CS.Generators.Tests\SDL3-CS.Generators.Tests.csproj --force --no-cache

      - name: Build managed wrapper and tests
        shell: pwsh
        run: |
          dotnet build .\SDL3-CS\SDL3-CS.csproj -c Release --no-restore /p:GeneratePackageOnBuild=false
          dotnet build .\SDL3-CS.Tests\SDL3-CS.Tests.csproj -c Release --no-restore
          dotnet build .\SDL3-CS.Generators.Tests\SDL3-CS.Generators.Tests.csproj -c Release --no-restore /p:GeneratePackageOnBuild=false

      - name: Run managed main callback generator tests
        shell: pwsh
        run: dotnet run --project .\SDL3-CS.Generators.Tests\SDL3-CS.Generators.Tests.csproj -c Release --no-build --no-restore

      - name: Validate managed main callback package consumer
        shell: pwsh
        run: |
          dotnet pack .\SDL3-CS\SDL3-CS.csproj -c Release --no-restore `
            /p:PackageVersion=3.4.16 `
            /p:RepositoryCommit=${{ github.sha }} `
            /p:GeneratePackageOnBuild=false `
            --output .\artifacts\managed-main-callbacks
          .\.github\release-tools\Test-ManagedMainCallbacksPackage.ps1 `
            -PackagePath .\artifacts\managed-main-callbacks\Graphix-CS.3.4.16.nupkg `
            -PackageVersion 3.4.16
          .\.github\release-tools\Test-NuGetPackageContents.ps1 `
            -PackageRevision 0 -ManagedOnly `
            -PackageDir .\artifacts\managed-main-callbacks

      - name: Restore tracked native runtime for managed tests
        shell: pwsh
        run: |
          ./.github/release-tools/Test-RestoreManagedReleaseTestRuntime.Tests.ps1
          ./.github/release-tools/Restore-ManagedReleaseTestRuntime.ps1 `
            -NativePackageRevision 0 `
            -Rid win-x64 `
            -Destination 'SDL3-CS.Tests/bin/Release/net8.0' `
            -UseTrackedPayload

      - name: Run managed wrapper tests
        shell: pwsh
        run: dotnet run --project .\SDL3-CS.Tests\SDL3-CS.Tests.csproj -c Release --no-build --no-restore

      - name: Audit public wrapper XML documentation
        shell: pwsh
        run: ./.github/release-tools/Test-PublicWrapperXmlDocs.ps1 -SourceRoot .\SDL3-CS

      - name: Validate generated GitHub Wiki contract
        shell: pwsh
        run: |
          ./.github/wiki-tools/Test-WikiTools.Tests.ps1
          ./.github/wiki-tools/Test-WikiReleaseContract.Tests.ps1

      - name: Validate trunk-based release lifecycle
        shell: pwsh
        run: |
          ./.github/release-tools/Test-TrunkBasedReleaseLifecycle.Tests.ps1
          ./.github/release-tools/Test-TrunkBasedReleaseLifecycle.ps1

      - name: Validate SDL Metal fence source regression contract
        shell: pwsh
        run: ./.github/release-tools/Test-SDLMetalFenceSemantics.Tests.ps1

      - name: Validate Android 16 KB release contract
        shell: pwsh
        run: |
          ./.github/release-tools/Test-AndroidBridgeJar.Tests.ps1
          ./.github/release-tools/Test-AndroidBridgeJar.ps1
          ./.github/release-tools/Test-AndroidPageSizeCompatibility.Tests.ps1
          ./.github/release-tools/Test-Android16KbRuntime.Tests.ps1
          $androidPayloadRoots = @(
            Get-ChildItem -LiteralPath './SDL3-CS.NativePackages' -Directory |
              Where-Object Name -Like 'SDL3-CS.Android*' |
              ForEach-Object {
                $libRoot = Join-Path $_.FullName 'lib'
                if (-not (Test-Path -LiteralPath $libRoot -PathType Container)) {
                  throw "Checked-in Android native package is missing its lib root: $libRoot"
                }
                $libRoot
              }
          )
          if ($androidPayloadRoots.Count -eq 0) {
            throw 'No checked-in Android native package lib roots were found.'
          }
          ./.github/release-tools/Test-AndroidPageSizeCompatibility.ps1 -Path $androidPayloadRoots
          ./.github/release-tools/Test-ReleaseWorkflow.Tests.ps1

      - name: Upload verified Graphix-CS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Graphix-CS-3.4.16
          path: artifacts/managed-main-callbacks/Graphix-CS.3.4.16.nupkg
          if-no-files-found: error
          retention-days: 30

  examples-desktop:
    name: Build desktop examples (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-2025
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-15

    steps:
      - name: Checkout SDL3-CS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build all desktop examples
        shell: pwsh
        run: ./.github/release-tools/Test-ExampleProjects.ps1 -Configuration Release -Scope Desktop

  examples-android:
    name: Build Android example
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout SDL3-CS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Validate Avalonia SDL_mixer Android example contract
        shell: pwsh
        run: ./.github/release-tools/Test-AndroidAvaloniaMixerAudioExample.Tests.ps1

      - name: Install Android .NET workload
        shell: pwsh
        run: dotnet workload install android --source https://api.nuget.org/v3/index.json

      - name: Build all Android examples
        shell: pwsh
        run: ./.github/release-tools/Test-ExampleProjects.ps1 -Configuration Release -Scope Android
